name: Go vulnerability scan

on:
  pull_request:
    branches:
      - main
      - release-1.23
      - release-1.26
      - backplane-2.11
      - backplane-2.17
  schedule:
    # Scan every maintained branch daily; scheduled workflows otherwise use
    # only the default branch.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  resolve_branches:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Resolve branches to scan
        id: set-branches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            branches='["main","release-1.23","release-1.26","backplane-2.11","backplane-2.17","backplane-5.0","backplane-5.1","backplane-5.2"]'
          else
            branch="$REF_NAME"
            [ "$EVENT_NAME" != "pull_request" ] || branch="$BASE_REF"
            branches=$(jq -cn --arg branch "$branch" '[$branch]')
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  govulncheck:
    needs: resolve_branches
    name: govulncheck (${{ matrix.branch }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || matrix.branch }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the scheduled scan coverage aligned with daily-security-scan.yaml and
        # docs/VULNERABILITY-MANAGEMENT.md. Only 5.1 and 5.2 fast-forward from main;
        # backplane-5.0 follows release-1.26 via its branch-specific ffwd workflow.
        # release-1.23 feeds an ACM build defined outside this repo.
        branch: ${{ fromJSON(needs.resolve_branches.outputs.branches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || matrix.branch }}
          persist-credentials: false

      - name: Get Go version
        id: vars
        run: echo "go_version=$(make go-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.vars.outputs.go_version }}

      # govulncheck exits 3 when it finds a reachable vulnerability, 1 or 2 when
      # the scan itself fails, 0 when clean. `make verify-govulncheck` collapses
      # every failure to 1, so the summary line in the output distinguishes
      # vulnerabilities from scan errors. Capture output before failing the job.
      - name: Run govulncheck
        id: scan
        run: |
          set -o pipefail
          status=0
          make verify-govulncheck 2>&1 | tee govulncheck-output.txt || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Classify result
        if: always()
        id: classify
        env:
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          # Sum "Your code is affected by N vulnerabilities." across both modules.
          # Absence of that line means govulncheck never got far enough to report.
          REACHABLE=$(grep -oE 'Your code is affected by [0-9]+ vulnerabilit' govulncheck-output.txt 2>/dev/null \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          # grep -c prints 0 *and* exits non-zero on no match, so capture the
          # substitution's status rather than appending a second 0 to the value.
          COMPLETED=$(grep -cE 'Your code is affected by [0-9]+ vulnerabilit' govulncheck-output.txt 2>/dev/null) || COMPLETED=0

          if [ "${STATUS:-1}" = "0" ]; then
            OUTCOME=clean
          elif [ "$COMPLETED" -gt 0 ] && [ "$REACHABLE" -gt 0 ]; then
            OUTCOME=vulnerable
          else
            OUTCOME=error
          fi

          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "reachable=$REACHABLE" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        if: always()
        env:
          BRANCH: ${{ matrix.branch }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          REACHABLE: ${{ steps.classify.outputs.reachable }}
        run: |
          {
            echo "# govulncheck (\`$BRANCH\`)"
            echo ""
            case "$OUTCOME" in
              clean)
                echo "## ✅ No reachable vulnerabilities"
                echo ""
                echo "govulncheck exits non-zero only when our code can actually *call* a"
                echo "vulnerable symbol. Advisories against modules we merely require are"
                echo "reported by Trivy instead — see the Daily security scan."
                ;;
              vulnerable)
                echo "## ❌ $REACHABLE reachable vulnerabilities"
                echo ""
                echo "Our code calls into vulnerable symbols. These are the highest-priority"
                echo "findings we produce: reachability is proven, not inferred."
                ;;
              *)
                echo "## ⚠️ Scan did not complete"
                echo ""
                echo "govulncheck failed before reporting. This is a scan failure, not a"
                echo "vulnerability finding."
                ;;
            esac
            echo ""
            echo "<details open>"
            echo "<summary><b>govulncheck output</b></summary>"
            echo ""
            echo '```'
            head -300 govulncheck-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save scan result for attestation
        if: always()
        env:
          BRANCH: ${{ matrix.branch }}
          OUTCOME: ${{ steps.classify.outputs.outcome }}
          REACHABLE: ${{ steps.classify.outputs.reachable }}
        run: |
          jq -n --arg branch "$BRANCH" --arg outcome "$OUTCOME" --arg reachable "$REACHABLE" \
            '{branch:$branch,outcome:$outcome,reachable:$reachable}' > scan-result.json

      - name: Upload govulncheck results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: govulncheck-results-${{ matrix.branch }}
          path: |
            govulncheck-output.txt
            scan-result.json
          retention-days: 30

      - name: Fail if govulncheck failed
        if: always() && steps.scan.outputs.status != '0'
        run: exit 1

  attest-results:
    needs: [resolve_branches, govulncheck]
    if: always() && !cancelled() && github.event_name != 'pull_request'
    name: Attest govulncheck results (${{ matrix.branch }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.resolve_branches.outputs.branches) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: govulncheck-results-${{ matrix.branch }}
          path: scan-results

      - name: Bundle scan results
        run: tar -czf govulncheck-results.tar.gz -C scan-results govulncheck-output.txt scan-result.json

      - name: Attest scan results
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: govulncheck-results.tar.gz

      - name: Upload attested scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: govulncheck-attested-${{ matrix.branch }}
          path: govulncheck-results.tar.gz
          retention-days: 30
